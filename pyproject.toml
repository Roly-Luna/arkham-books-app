[project]
name = "arkham-books-app"
version = "0.2.0"
description = "Bookstore catalog and reader community application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "pymongo>=4.13.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "streamlit>=1.40.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
